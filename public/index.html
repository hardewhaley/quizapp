  <div id="quiz-question" class="bg-white shadow-lg rounded-2xl p-6 w-full max-w-xl">

    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">BrainSpark</h2>
      <span id="timer" class="text-red-500 font-semibold"></span>
    </div>

    <!-- Question -->
    <div id="question" class="text-lg font-medium mb-4"></div>

    <!-- Options -->
    <!-- <button class="w-full text-left"> -->
    <div id="options" class="space-y-3"></div>

    <!-- Button -->
     <div class="flex justify-between mt-5">
      <span class="text-sm font-medium" id="noofquiz">Question 3 of 10</span>
      <span class="text-sm font-medium" id="quizpct">30%</span>
    </div>
     <div class="w-full bg-gray-300 rounded-full mt-2 h-4  overflow-hidden">
      <div class="bg-blue-500 h-4 rounded-full transition-all duration-500"
            id="progress">
      </div>
    </div>
    <div class="flex justify-between items-center">
      <button onclick="prevQuestion()"
        class="mt-5 w-20 bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 cursor-pointer">Previous</button>
      <div class="text-center mt-2" id="noofquiz"></div>
      <button onclick="nextQuestion()"
        class="mt-5 w-20 bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 cursor-pointer">Next</button>
    </div>
  
  </div>


  <div class="bg-white shadow-lg rounded-2xl hidden p-6 w-full max-w-xl" id="result">
    <h1 class="font-bold text-3xl text-center text-black px-6 py-4"
      style="font-family: 'Times New Roman', Times, serif;">Your BrainSpark Results</h1>
    <div class="relative w-40 h-40 mr-auto ml-auto">
      <div class="w-full h-full rounded-full" id="chart"></div>
      <div class="absolute inset-4 bg-white rounded-full flex items-center justify-center"><span
          class="text-3xl font-bold" id="percentage"></span>
      </div>
    </div>
    <div class="flex justify-between">
      <p class="font-bold font-mono text-green-500">Correct: <span id="correct"></span></p>
      <button class="w-56">
        <a href="index.html">
          <p class="font-bold text-center border-none rounded-lg p-2 cursor-pointer hover:bg-gray-50 space-y-3 mt-3 text-2xl">
            Start Again</p>
        </a>
      </button>
      <p class="font-bold font-mono text-red-500">Wrong: <span id="wrong"></span></p>
    </div>
    <div class="border border-gray-300 rounded-lg overflow-hidden mt-5">
      
      <!-- Button -->
      <button 
        class="w-full flex justify-between items-center p-4 bg-white hover:bg-gray-50"
        onclick="toggleAccordion('content-review')"
      >
        <span class="font-semibold text-2xl text-center">Review Quiz</span>
        <span>+</span>
      </button>

      <!-- content review -->
      <div id="content-review" class="hidden p-4 bg-gray-50 border-t">
