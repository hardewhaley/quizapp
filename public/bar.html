<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="max-w-lg mx-auto bg-white p-6 rounded-xl shadow-lg mt-10">

  <h2 class="text-2xl font-bold text-center mb-6">
    Contact Support
  </h2>

  <form class="space-y-4">

    <!-- Name -->
    <div>
      <label class="block mb-1 font-medium">Name</label>
      <input type="text"
             placeholder="Enter your name"
             class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Email -->
    <div>
      <label class="block mb-1 font-medium">Email</label>
      <input type="email"
             placeholder="Enter your email"
             class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Message -->
    <div>
      <label class="block mb-1 font-medium">Message</label>
      <textarea rows="4"
                placeholder="Describe your issue..."
                class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
    </div>

    <!-- Submit -->
    <button type="submit"
            class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg transition">
      Send Message
    </button>

  </form>

</div>
</body>
</html>
